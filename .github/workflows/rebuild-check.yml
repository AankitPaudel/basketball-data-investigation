# Cloud rebuild check: rebuild the three validated games from the committed sanitized
# fixtures and compare the CSV content hashes with the ones produced locally on Windows.
# Fully offline apart from checkout and pip: it never contacts stats.ncaa.org or any
# other data source. Manual trigger only.
name: Rebuild check (manual, offline)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # SHA-256 of the combined CSV built locally from the same fixtures.
      EXPECTED_COMBINED_SHA256: 402921c1ad1bf0a74590ca360a972dc36eaf0ddb630e4a44651b17e9ec6df03f
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pinned dependencies
        run: python -m pip install -r requirements-tested.txt

      - name: Offline tests
        run: python -m unittest discover -s tests

      - name: Rebuild each game from fixtures and compare hashes
        run: |
          set +e
          python -m src.main build-ncaa-games --plan config/ncaa_games_fixtures.json > rebuild.json
          code=$?
          set -e
          cat rebuild.json
          # Exit 2 is expected (Ferrum division_reclassifying warnings); 4 means a game failed.
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then exit "$code"; fi
          python - <<'EOF'
          import json
          games = json.load(open("rebuild.json"))["games"]
          for game in games:
              print(game["game_id"], game["csv_sha256"], "match" if game.get("rebuild_match") else "MISMATCH")
          assert len(games) == 3 and all(game.get("rebuild_match") for game in games), "rebuild hash mismatch"
          EOF

      - name: Combine and compare the combined hash
        run: >
          python -m src.main combine-ncaa-games --plan config/ncaa_games_fixtures.json
          --output data/processed/fixture-rebuild/combined --expect-sha256 "$EXPECTED_COMBINED_SHA256"

      - name: Upload rebuilt CSVs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rebuild-check-${{ github.run_id }}
          path: |
            rebuild.json
            data/processed/fixture-rebuild/
          if-no-files-found: warn
          retention-days: 30
